[package]
name = "plan-ai-chat-server"
version = "0.8.0"
edition = "2024"

[dependencies]
glob = "0.3"
base64 = "0.22"
ring = "0.17"
sha2 = "0.10"
url = "2"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
mac-mgmt-common = { path = "../common", features = ["otel-axum"] }
plan-ai-accounts = { path = "../common/plan-ai-accounts" }
plan-ai-oauth = { path = "../common/plan-ai-oauth" }
# /public/mcp: its own MCP handler, which asks the user (elicitation).
rmcp = { workspace = true, features = ["elicitation", "transport-streamable-http-server"] }
plan-ai-api-mcp = { path = "../common/plan-ai-api-mcp" }
plan-ai-auth = { path = "../common/plan-ai-auth", features = ["server"] }
plan-ai-connector = { path = "../common/plan-ai-connector" }
reqwest = { workspace = true, features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
schemars = { version = "1.2", features = ["derive", "uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-stream = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
