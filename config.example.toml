# Copy to config.toml (or point CONFIG_PATH at it).

[database]
url = "postgres://postgres@127.0.0.1:5433/postgres"

[web]
listen = "127.0.0.1:8080"
static_dir = "web/dist"

# Zitadel sign-in. Leave out locally: a debug build with DEV_ONLY_NO_AUTH=1
# signs everyone in as dev@localhost (admin).
# [auth]
# cookie_secret = "CHANGE_ME_64_hex_chars"   # openssl rand -hex 32
# external_url = "https://chat.plan.ai"
# admin_emails = ["you@plan.ai"]
#
# [[auth.providers]]
# slug = "zitadel"                 # redirect URI: {external_url}/auth/zitadel/callback
# name = "plan.ai"
# issuer = "https://id.plan.ai"
# client_id = "xxx"                 # project "plan.ai chat" in the plan.ai org
# client_secret = "xxx"
# allow_all = true
# zitadel_org = "397597061693833352"   # only plan.ai org accounts sign in

[accounts]
admin_emails = []

[subnet]
url = "http://127.0.0.1:7700"
token = "CHANGE_ME"              # subnet issue_token for client "chat"
callback_secret = "CHANGE_ME_at_least_32_chars"   # openssl rand -hex 32; subnet sends it as CHAT_CALLBACK_SECRET
types = { sales = "chat-sales", machine_config = "chat-machine-config" }

[approval]
# Validator model (layer 2), via LiteLLM. Unset: static checks, then the user.
# validator_url = "https://litellm.plan.ai/v1"
# validator_api_key = "sk-xxx"
# validator_model = "claude-haiku-4-5"

[chat]
hourly_input_tokens = 100000
hourly_output_tokens = 20000
max_chars = 2048

# The sales assistant reads mac-mgmt's catalog with this service token.
# [catalog]
# url = "https://mgmt.plan.ai/daemon/"
# token = "CHANGE_ME"

# Acting as the user on plan.ai services (Zitadel token exchange, see
# common/plan-ai-connector/README.md). Without it, machine_config is off.
# [connector.exchange]
# issuer = "https://id.plan.ai"
# client = { method = "basic", client_id = "xxx", client_secret = "xxx" }   # app with the token-exchange grant
# actor = { method = "jwt_profile", key = { type = "serviceaccount", keyId = "xxx", key = "-----BEGIN RSA PRIVATE KEY-----...", userId = "xxx" } }
#
# [[connector.targets]]
# name = "mac-mgmt"
# description = "plan.ai machine management (mgmt.plan.ai): your clusters' config, skills, bundles, MCP servers, SSH keys"
# kind = "mac-mgmt"
# mcp_url = "https://mgmt.plan.ai/mcp"
# audience_project_id = "397603440676569224"   # Zitadel project "mgmt.plan.ai API"
#
# # Each user's plan-ai-cloud deployments, listed by the console for them.
# [connector.console]
# url = "https://cloud.plan.ai"
# audience_project_id = "397603595463164040"   # Zitadel project "cloud.plan.ai API"
